<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        .required::after {
            content: ' *'; 
            color: #ef4444;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        input.error, select.error, textarea.error {
            border-color: #ef4444;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .char-count {
            text-align: right;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 5px;
        }

        .stars {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 8px;
            padding: 10px 0;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 30px;
            color: #d1d5db;
            cursor: pointer;
            margin: 0;
            transition: color 0.2s ease;
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #f59e0b;
        }

        .stars label:active {
            transform: scale(0.95);
        }

        .error-message {
            display: none;
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .button-text {
            transition: opacity 0.2s ease;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 16px;
            text-align: center;
            color: #166534;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-alert {
            display: none;
            margin-top: 20px;
            padding: 16px;
            text-align: center;
            color: #dc2626;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            animation: fadeIn 0.3s ease;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>We Value Your Feedback!</h1>
            <p class="subtitle">
                Help us improve by sharing your experience with us.
            </p>
        </div>

        <form id="feedbackForm" novalidate>

            <div class="form-group">
                <label for="name" class="required">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name"
                       required>
                <div class="error-message" id="name-error">Please enter your full name.</div>
            </div>

            <div class="form-group">
                <label for="email" class="required">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email address"
                       required>
                <div class="error-message" id="email-error">Please enter a valid email address.</div>
            </div>

            <div class="form-group">
                <label class="required">Rate Your Experience</label>

                <div class="stars" role="radiogroup" aria-label="Rating">
                    <input type="radio" id="star5"
                           name="rating" value="5" required>
                    <label for="star5" title="5 stars">★</label>

                    <input type="radio" id="star4"
                           name="rating" value="4">
                    <label for="star4" title="4 stars">★</label>

                    <input type="radio" id="star3"
                           name="rating" value="3">
                    <label for="star3" title="3 stars">★</label>

                    <input type="radio" id="star2"
                           name="rating" value="2">
                    <label for="star2" title="2 stars">★</label>

                    <input type="radio" id="star1"
                           name="rating" value="1">
                    <label for="star1" title="1 star">★</label>
                </div>
                <div class="error-message" id="rating-error">Please select a rating.</div>
            </div>

            <div class="form-group">
                <label for="category" class="required">Feedback Category</label>
                <select id="category" required>
                    <option value="">Select a category</option>
                    <option value="General">General Feedback</option>
                    <option value="Suggestion">Suggestion</option>
                    <option value="Complaint">Complaint</option>
                    <option value="Bug">Report a Problem</option>
                </select>
                <div class="error-message" id="category-error">Please select a feedback category.</div>
            </div>

            <div class="form-group">
                <label for="feedback" class="required">Your Feedback</label>
                <textarea id="feedback"
                          placeholder="Write your feedback here..."
                          required
                          maxlength="500"></textarea>
                <div class="char-count" id="feedback-count">0 / 500</div>
                <div class="error-message" id="feedback-error">Please enter your feedback.</div>
            </div>

            <button type="submit" id="submitBtn">
                <span class="spinner"></span>
                <span class="button-text">Submit Feedback</span>
            </button>

            <div id="message" role="status" aria-live="polite"></div>
            <div id="errorAlert" class="error-alert"></div>

        </form>
    </div>

    <script>
        const form = document.getElementById("feedbackForm");
        const message = document.getElementById("message");
        const errorAlert = document.getElementById("errorAlert");
        const submitBtn = document.getElementById("submitBtn");
        const buttonText = submitBtn.querySelector(".button-text");
        const spinner = submitBtn.querySelector(".spinner");
        const feedbackText = document.getElementById("feedback");
        const feedbackCount = document.getElementById("feedback-count");

        const fields = {
            name: { id: "name", errorId: "name-error", message: "Please enter your full name." },
            email: { id: "email", errorId: "email-error", message: "Please enter a valid email address." },
            rating: { id: "rating", errorId: "rating-error", message: "Please select a rating." },
            category: { id: "category", errorId: "category-error", message: "Please select a feedback category." },
            feedback: { id: "feedback", errorId: "feedback-error", message: "Please enter your feedback." }
        };

        function clearErrors() {
            Object.values(fields).forEach(field => {
                const input = document.getElementById(field.id);
                const error = document.getElementById(field.errorId);
                if (input) input.classList.remove("error");
                if (error) error.style.display = "none";
            });
            message.style.display = "none";
            errorAlert.style.display = "none";
        }

        function showError(fieldKey) {
            const field = fields[fieldKey];
            const input = document.getElementById(field.id);
            const error = document.getElementById(field.errorId);
            if (input) input.classList.add("error");
            if (error) {
                error.textContent = field.message;
                error.style.display = "block";
            }
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validateForm() {
            clearErrors();
            let isValid = true;

            const name = document.getElementById("name").value.trim();
            if (!name) {
                showError("name");
                isValid = false;
            }

            const email = document.getElementById("email").value.trim();
            if (!email || !validateEmail(email)) {
                showError("email");
                isValid = false;
            }

            const rating = document.querySelector('input[name="rating"]:checked');
            if (!rating) {
                showError("rating");
                isValid = false;
            }

            const category = document.getElementById("category").value;
            if (!category) {
                showError("category");
                isValid = false;
            }

            const feedback = document.getElementById("feedback").value.trim();
            if (!feedback) {
                showError("feedback");
                isValid = false;
            }

            return isValid;
        }

        feedbackText.addEventListener("input", function() {
            const length = this.value.length;
            feedbackCount.textContent = length + " / 500";
            if (length > 450) {
                feedbackCount.style.color = "#ef4444";
            } else {
                feedbackCount.style.color = "#9ca3af";
            }
        });

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            if (!validateForm()) return;

            submitBtn.disabled = true;
            spinner.style.display = "inline-block";
            buttonText.style.opacity = "0.7";

            const name = document.getElementById("name").value.trim();
            const rating = document.querySelector('input[name="rating"]:checked').value;

            setTimeout(() => {
                message.textContent =
                    "Thank you, " + name +
                    "! Your " + rating +
                    "-star feedback has been submitted successfully.";

                message.style.display = "block";

                submitBtn.disabled = false;
                spinner.style.display = "none";
                buttonText.style.opacity = "1";

                form.reset();
                feedbackCount.textContent = "0 / 500";
                feedbackCount.style.color = "#9ca3af";

                setTimeout(() => {
                    message.style.display = "none";
                }, 5000);
            }, 1200);
        });

        document.querySelectorAll("input, select, textarea").forEach(input => {
            input.addEventListener("input", function() {
                if (this.classList.contains("error")) {
                    this.classList.remove("error");
                    const errorId = this.id + "-error";
                    const errorEl = document.getElementById(errorId);
                    if (errorEl) errorEl.style.display = "none";
                }
            });
        });
    </script>

</body>
</html>
